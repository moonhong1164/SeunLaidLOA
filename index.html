<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOST ARK RAID CHECKER</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">LOST ARK</p>
        <h1>RAID CHECKER</h1>
        <p class="subtitle">주간 레이드 클리어 현황을 캐릭터별로 관리하세요.</p>
      </div>
      <div class="week-badge" id="weekBadge"></div>
    </header>

    <section class="toolbar card">
      <div class="input-wrap">
        <label for="characterName">캐릭터 추가</label>
        <div class="input-row">
          <input id="characterName" type="text" maxlength="20" placeholder="캐릭터 이름 입력" />
          <button id="addCharacterBtn" class="btn primary">추가</button>
        </div>
      </div>
      <div class="toolbar-actions">
        <button id="copyBtn" class="btn">현재 현황 복사</button>
        <button id="resetBtn" class="btn danger">이번 주 전체 초기화</button>
      </div>
    </section>

    <section class="summary card">
      <div>
        <span class="summary-label">전체 진행도</span>
        <strong id="progressText">0 / 0</strong>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section id="emptyState" class="empty card">
      <div class="empty-icon">✦</div>
      <h2>아직 등록된 캐릭터가 없어요.</h2>
      <p>위에서 캐릭터 이름을 추가하면 레이드 체크표가 만들어집니다.</p>
    </section>

    <section id="characters" class="characters"></section>
  </main>

  <template id="characterTemplate">
    <article class="character-card card">
      <div class="character-header">
        <div>
          <span class="mini-label">CHARACTER</span>
          <h2 class="character-name"></h2>
        </div>
        <button class="icon-btn delete-character" title="캐릭터 삭제" aria-label="캐릭터 삭제">×</button>
      </div>
      <div class="raid-list"></div>
      <div class="character-progress">
        <span class="character-progress-text"></span>
        <div class="mini-progress-track"><div class="mini-progress-fill"></div></div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
